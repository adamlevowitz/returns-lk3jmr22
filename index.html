<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Amazon Returns</title>
<style>
body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1f2933;font-size:18px;line-height:1.3}
.w{max-width:700px;margin:auto;padding:14px}
h1{font-size:24px;margin:6px 0 10px}
a.b{display:block;text-align:center;background:#1f6feb;color:#fff;text-decoration:none;font-weight:700;padding:14px;border-radius:10px;margin:0 0 14px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #d5dbe1;border-radius:10px;padding:11px 12px;margin:6px 0}
.n{font-weight:600}
.l{flex:none;font-size:13px;font-weight:700;padding:4px 9px;border-radius:6px;text-align:right;max-width:46%}
.WF{background:#d9f2e0;color:#14662b}.UPS{background:#dbe7ff;color:#1a3f9c}.UPSL{background:#ffdcdc;color:#a3190f}
.UPSS{background:#ead9fb;color:#5b2796}.KO{background:#fde9cc;color:#8a4600}.PK{background:#e0f2f1;color:#00695c}.VF{background:#eceff1;color:#455a64}
</style></head><body><div class="w">
<h1>Amazon Returns</h1>
<a class="b" href="details.html">QR codes &amp; details</a>
<div id="app"></div>
</div>
<script>
var L={
 WF:["Whole Foods","WF"],
 UPS:["UPS","UPS"],
 UPSL:["UPS (print label)","UPSL"],
 UPSS:["UPS Store only","UPSS"],
 SELL:["UPS (to seller)","UPSL"],
 KO:["Kohl's","KO"],
 PK:["UPS home pickup","PK"],
 VF:["Verify: UPS Store","VF"]
};
var I=[
 ["10 Sets Glass Food Containers","WF"],
 ["Amazon Basics Drinking Glasses","WF"],
 ["Amazon Basics 4 Slice Toaster","UPSL"],
 ["Amazon Basics Mint Dental Flosses","WF"],
 ["Anker USB C Hub","WF"],
 ["Apple Magic Keyboard","WF"],
 ["Bear Mini Rice Cooker","WF"],
 ["Bounty Paper Towels","UPSS"],
 ["Can Opener, 3-In-1","UPS"],
 ["Cuisinart 4-Slice Stainless","UPSL"],
 ["Cuisinart Chef's Classic Stainless","UPS"],
 ["Dish Rack","KO"],
 ["ESCO LITE Black Light","WF"],
 ["EverGrace Cross Stitch","UPS"],
 ["FELIWAY Cat Diffuser Kit","WF"],
 ["Flash Furniture Mindy Kids Navy","UPS"],
 ["Ice Packs","WF"],
 ["MALACASA Fruit Bowl","WF"],
 ["Marscamd Motorcycle Dry Bag","VF"],
 ["Mifoci 4 Pack Stainless","WF"],
 ["Minnetonka Men's Sheepskin","SELL"],
 ["Porcelain Dinnerware + Cottonelle Toilet Paper","UPSS"],
 ["Roter Mond 4 Slice Toaster","WF"],
 ["THETCHRY Walnut Cutting Boards","WF"],
 ["THINDUST Winter Skull Cap","KO"],
 ["Toddleroo by North States","UPS"],
 ["Training Mat","UPS"],
 ["VELOHEIM Bamboo Side Table","PK"],
 ["WDCOZY Cloud Soft Quilt Set","KO"],
 ["YSAGi Desk Protector + Amazer Shower Hooks","WF"]
];
I.sort(function(a,b){return a[0].localeCompare(b[0],undefined,{numeric:true,sensitivity:"base"})});
document.getElementById("app").innerHTML=I.map(function(x){
 var l=L[x[1]];
 return '<div class="r"><span class="n">'+x[0].replace(/&/g,"&amp;")+'</span><span class="l '+l[1]+'">'+l[0]+'</span></div>';
}).join("");
</script></body></html>
